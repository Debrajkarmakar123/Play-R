```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLAYR — Admin Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 0%,#24150f 0%,transparent 38%),
        #080808;
    color:#f5f5f3;
    font-family:Inter,Arial,sans-serif;
    padding:20px;
}

.login{
    width:min(390px,100%);
}

.logo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:22px;
    font-weight:800;
    margin-bottom:32px;
}

.logo-mark{
    width:23px;
    height:23px;
    background:linear-gradient(135deg,#ff914d,#ff4f2d);
    border-radius:6px;
    transform:rotate(45deg);
}

.card{
    background:#111;
    border:1px solid #292929;
    border-radius:14px;
    padding:27px;
    box-shadow:0 25px 70px rgba(0,0,0,.4);
}

.label{
    color:#777;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-weight:700;
}

h1{
    font-size:25px;
    margin-top:8px;
    letter-spacing:-1px;
}

.subtitle{
    color:#666;
    font-size:10px;
    line-height:1.6;
    margin-top:8px;
    margin-bottom:25px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    color:#aaa;
    font-size:10px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:12px;
    border-radius:7px;
    border:1px solid #292929;
    background:#090909;
    color:white;
    outline:none;
    font-family:inherit;
    font-size:11px;
}

input:focus{
    border-color:#555;
}

button{
    width:100%;
    padding:13px;
    margin-top:5px;
    border:0;
    border-radius:7px;
    background:linear-gradient(135deg,#fff,#d9d9d9);
    color:#090909;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.error{
    display:none;
    margin-top:14px;
    padding:11px;
    border-radius:7px;
    background:#1d1010;
    border:1px solid #452020;
    color:#ff9b9b;
    font-size:9px;
    line-height:1.5;
}

.footer{
    text-align:center;
    color:#444;
    font-size:8px;
    margin-top:18px;
}

</style>
</head>

<body>

<div class="login">

    <div class="logo">
        <span class="logo-mark"></span>
        PLAYR
    </div>

    <div class="card">

        <div class="label">
            Private Area
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Sign in to manage game submissions and review developers.
        </p>


        <form id="loginForm">

            <div class="field">

                <label>Email</label>

                <input
                    id="email"
                    type="email"
                    placeholder="Admin email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label>Password</label>

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button id="loginButton" type="submit">
                SIGN IN
            </button>

        </form>


        <div id="error" class="error"></div>

    </div>


    <div class="footer">
        PLAYR Private Administration
    </div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDo-HuNAg5riiSDm-vqbtlrq1E2q6Yfhz8",

    authDomain:
        "playr-bebbf.firebaseapp.com",

    databaseURL:
        "https://playr-bebbf-default-rtdb.firebaseio.com",

    projectId:
        "playr-bebbf",

    storageBucket:
        "playr-bebbf.firebasestorage.app",

    messagingSenderId:
        "35506561862",

    appId:
        "1:35506561862:web:f7b27c1191637cf36abb47",

    measurementId:
        "G-C9RGJYKTP9"

};


/* =========================================
   INITIALIZE
========================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =========================================
   LOGIN
========================================= */

const form =
    document.getElementById("loginForm");

const button =
    document.getElementById("loginButton");

const errorBox =
    document.getElementById("error");


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        errorBox.style.display =
            "none";


        button.disabled =
            true;

        button.textContent =
            "SIGNING IN...";


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            window.location.href =
                "admin.html";

        }

        catch(error){

            console.error(error);

            errorBox.textContent =
                "Login failed. Please check your email and password.";

            errorBox.style.display =
                "block";

        }

        finally{

            button.disabled =
                false;

            button.textContent =
                "SIGN IN";

        }

    }

);

</script>

</body>
</html>
