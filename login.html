<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLAYR — Login</title>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDo-HuNAg5riiSDm-vqbtlrq1E2q6Yfhz8",
    authDomain: "playr-bebbf.firebaseapp.com",
    projectId: "playr-bebbf",
    storageBucket: "playr-bebbf.firebasestorage.app",
    messagingSenderId: "35506561862",
    appId: "1:35506561862:web:f7b27c1191637cf36abb47"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");

const loginBox = document.getElementById("loginBox");
const signupBox = document.getElementById("signupBox");

const loginMessage = document.getElementById("loginMessage");
const signupMessage = document.getElementById("signupMessage");

document.getElementById("showSignup").onclick = () => {
    loginBox.style.display = "none";
    signupBox.style.display = "block";
};

document.getElementById("showLogin").onclick = () => {
    signupBox.style.display = "none";
    loginBox.style.display = "block";
};

loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    showMessage(loginMessage, "Logging in...", false);

    try {
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        window.location.href = "profile.html";

    } catch (error) {
        showMessage(
            loginMessage,
            getFirebaseError(error.code),
            true
        );
    }
});

signupForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name =
        document.getElementById("signupName").value.trim();

    const email =
        document.getElementById("signupEmail").value.trim();

    const password =
        document.getElementById("signupPassword").value;

    if (password.length < 6) {
        showMessage(
            signupMessage,
            "Password must be at least 6 characters.",
            true
        );
        return;
    }

    showMessage(signupMessage, "Creating account...", false);

    try {

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        await updateProfile(
            result.user,
            {
                displayName: name
            }
        );

        window.location.href = "profile.html";

    } catch (error) {

        showMessage(
            signupMessage,
            getFirebaseError(error.code),
            true
        );
    }
});

function showMessage(element, message, error) {

    element.textContent = message;
    element.style.display = "block";

    if (error) {
        element.className = "message error";
    } else {
        element.className = "message";
    }
}

function getFirebaseError(code) {

    switch (code) {

        case "auth/invalid-credential":
            return "Incorrect email or password.";

        case "auth/user-not-found":
            return "No account found with this email.";

        case "auth/wrong-password":
            return "Incorrect password.";

        case "auth/email-already-in-use":
            return "This email is already registered.";

        case "auth/invalid-email":
            return "Please enter a valid email.";

        case "auth/weak-password":
            return "Password is too weak.";

        default:
            return "Something went wrong. Please try again.";
    }
}
</script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 50% 0%,
            #24150f,
            transparent 35%
        ),
        #070707;

    color: #f7f7f5;
    font-family: Inter, Arial, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.container {
    width: min(420px, 100%);
}

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;

    color: white;
    text-decoration: none;

    font-size: 25px;
    font-weight: 800;

    margin-bottom: 35px;
}

.logo-mark {
    width: 25px;
    height: 25px;

    border-radius: 7px;

    background:
        linear-gradient(
            135deg,
            #ff914d,
            #ff4f2d
        );

    transform: rotate(45deg);
}

.card {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 15px;

    padding: 28px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.5);
}

h1 {
    font-size: 26px;
    letter-spacing: -1px;
}

.subtitle {
    color: #777;
    font-size: 11px;
    line-height: 1.6;
    margin-top: 7px;
    margin-bottom: 25px;
}

.field {
    margin-bottom: 17px;
}

label {
    display: block;
    color: #bbb;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 7px;
}

input {
    width: 100%;

    background: #080808;
    border: 1px solid #292929;

    color: white;

    border-radius: 7px;

    padding: 13px;

    outline: none;

    font-size: 12px;
}

input:focus {
    border-color: #ff7045;
}

.button {
    width: 100%;

    border: 0;
    border-radius: 7px;

    padding: 13px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #d9d9d9
        );

    color: #090909;

    font-size: 11px;
    font-weight: 800;

    cursor: pointer;

    margin-top: 5px;
}

.button:hover {
    transform: translateY(-1px);
}

.message {
    display: none;

    margin-top: 15px;

    padding: 11px;

    border-radius: 7px;

    background: #171717;

    border: 1px solid #292929;

    color: #aaa;

    font-size: 10px;

    line-height: 1.5;
}

.message.error {
    background: #1b100e;
    border-color: #48231c;
    color: #e99a88;
}

.switch {
    text-align: center;

    margin-top: 20px;

    color: #666;

    font-size: 10px;
}

.switch button {
    border: 0;
    background: none;

    color: #ff8754;

    cursor: pointer;

    font-size: 10px;
}

#signupBox {
    display: none;
}

.back {
    display: block;

    text-align: center;

    margin-top: 22px;

    color: #555;

    text-decoration: none;

    font-size: 10px;
}

.back:hover {
    color: white;
}

</style>
</head>

<body>

<div class="container">

    <a class="logo" href="index.html">
        <span class="logo-mark"></span>
        PLAYR
    </a>

    <div class="card">

        <!-- LOGIN -->

        <div id="loginBox">

            <h1>Welcome back.</h1>

            <p class="subtitle">
                Login to your PLAYR account.
            </p>

            <form id="loginForm">

                <div class="field">

                    <label>Email</label>

                    <input
                        id="loginEmail"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>

                <div class="field">

                    <label>Password</label>

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Your password"
                        required
                    >

                </div>

                <button
                    class="button"
                    type="submit"
                >
                    LOGIN
                </button>

            </form>

            <div
                id="loginMessage"
                class="message"
            ></div>

            <div class="switch">

                Don't have an account?

                <button id="showSignup">
                    Create one
                </button>

            </div>

        </div>


        <!-- SIGNUP -->

        <div id="signupBox">

            <h1>Create account.</h1>

            <p class="subtitle">
                Join PLAYR and start playing.
            </p>

            <form id="signupForm">

                <div class="field">

                    <label>Display Name</label>

                    <input
                        id="signupName"
                        type="text"
                        placeholder="Your name"
                        minlength="2"
                        maxlength="40"
                        required
                    >

                </div>

                <div class="field">

                    <label>Email</label>

                    <input
                        id="signupEmail"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>

                <div class="field">

                    <label>Password</label>

                    <input
                        id="signupPassword"
                        type="password"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >

                </div>

                <button
                    class="button"
                    type="submit"
                >
                    CREATE ACCOUNT
                </button>

            </form>

            <div
                id="signupMessage"
                class="message"
            ></div>

            <div class="switch">

                Already have an account?

                <button id="showLogin">
                    Login
                </button>

            </div>

        </div>

    </div>

    <a
        class="back"
        href="index.html"
    >
        ← Back to PLAYR
    </a>

</div>

</body>
</html>
