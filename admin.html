```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLAYR — Admin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070707;
    --panel:#101010;
    --panel2:#141414;
    --line:#292929;
    --muted:#777;
    --soft:#aaa;
    --white:#f5f5f3;
    --orange:#ff7845;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            900px 420px at 50% -160px,
            rgba(255,100,45,.17),
            transparent 70%
        ),
        var(--bg);
    color:var(--white);
    font-family:Inter,Arial,sans-serif;
}

.topbar{
    height:82px;
    border-bottom:1px solid #202020;
    background:rgba(7,7,7,.9);
    backdrop-filter:blur(18px);

    display:flex;
    align-items:center;
    padding:0 48px;

    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    display:flex;
    align-items:center;
    gap:13px;

    font-size:23px;
    font-weight:900;
    letter-spacing:-.8px;
}

.logo-mark{
    width:25px;
    height:25px;

    background:
        linear-gradient(
            135deg,
            #ff9a63,
            #ff4926
        );

    border-radius:7px;
    transform:rotate(45deg);
}

.admin-pill{
    margin-left:auto;

    display:flex;
    align-items:center;
    gap:9px;

    color:#777;

    font-size:9px;
    font-weight:800;
    letter-spacing:1.5px;
}

.admin-dot{
    width:7px;
    height:7px;
    border-radius:50%;

    background:#78d68b;

    box-shadow:
        0 0 14px rgba(120,214,139,.55);
}

.container{
    width:min(1450px,94%);
    margin:55px auto 100px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    gap:30px;

    margin-bottom:38px;
}

.eyebrow{
    color:var(--orange);

    font-size:10px;
    font-weight:900;

    letter-spacing:2px;
    text-transform:uppercase;
}

h1{
    margin-top:10px;

    font-size:48px;
    line-height:1;

    letter-spacing:-2.8px;
}

.header p{
    margin-top:13px;

    color:#686868;

    font-size:12px;
    line-height:1.6;
}

.refresh{
    min-width:120px;

    padding:13px 18px;

    border-radius:8px;

    border:1px solid #303030;

    background:#121212;
    color:#c8c8c8;

    font-size:10px;
    font-weight:800;

    cursor:pointer;
}

.refresh:hover{
    background:#1a1a1a;
    border-color:#444;
    color:white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:32px;
}

.stat{
    min-height:145px;

    padding:25px;

    border:1px solid var(--line);

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            #141414,
            #0d0d0d
        );

    box-shadow:
        0 20px 50px rgba(0,0,0,.18);
}

.stat-label{
    color:#6e6e6e;

    font-size:9px;
    font-weight:800;

    letter-spacing:1.4px;
    text-transform:uppercase;
}

.stat-number{
    margin-top:17px;

    font-size:38px;
    font-weight:900;

    letter-spacing:-1.5px;
}

.stat-sub{
    margin-top:6px;

    color:#505050;

    font-size:9px;
}

.panel{
    border:1px solid var(--line);

    border-radius:18px;

    overflow:hidden;

    background:#0e0e0e;

    box-shadow:
        0 30px 90px rgba(0,0,0,.25);
}

.toolbar{
    min-height:78px;

    padding:15px 20px;

    border-bottom:1px solid #242424;

    display:flex;
    align-items:center;

    gap:8px;
}

.tab{
    padding:11px 17px;

    border:1px solid transparent;

    border-radius:8px;

    background:transparent;

    color:#686868;

    font-size:10px;
    font-weight:800;

    cursor:pointer;
}

.tab:hover{
    background:#171717;
    color:#aaa;
}

.tab.active{
    background:#1c1c1c;

    color:white;

    border-color:#303030;
}

.search{
    margin-left:auto;

    width:280px;

    padding:12px 14px;

    border-radius:8px;

    background:#080808;

    border:1px solid #292929;

    color:white;

    outline:none;

    font-size:10px;
}

.search:focus{
    border-color:#484848;
}

.content{
    padding:20px;
}

.submissions{
    display:grid;
    gap:18px;
}

.submission{
    padding:25px;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #151515,
            #111
        );

    border:1px solid #292929;

    transition:
        transform .18s,
        border-color .18s;
}

.submission:hover{
    transform:translateY(-2px);
    border-color:#3a3a3a;
}

.card-top{
    display:flex;
    gap:25px;
    align-items:flex-start;
}

.thumbnail{
    width:210px;
    height:135px;

    flex:none;

    border-radius:11px;

    overflow:hidden;

    border:1px solid #303030;

    background:
        radial-gradient(
            circle at 30% 20%,
            #3b2117,
            #15100e 60%,
            #0b0b0b
        );

    display:flex;
    align-items:center;
    justify-content:center;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.thumbnail-placeholder{
    color:#4d4d4d;

    font-size:9px;
    font-weight:800;

    letter-spacing:1px;
}

.info{
    min-width:0;
    flex:1;
    padding-top:3px;
}

.title-line{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:11px;
}

.game-name{
    font-size:25px;
    font-weight:900;
    letter-spacing:-.8px;
}

.status{
    padding:6px 9px;

    border-radius:6px;

    font-size:8px;
    font-weight:900;

    letter-spacing:1px;

    text-transform:uppercase;
}

.status.pending{
    color:#ffad7c;
    background:#28170f;
    border:1px solid #493021;
}

.status.approved{
    color:#91dda0;
    background:#102016;
    border:1px solid #29442f;
}

.status.rejected{
    color:#ff9b9b;
    background:#241212;
    border:1px solid #452424;
}

.developer{
    margin-top:11px;
    color:#999;
    font-size:12px;
}

.meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:16px;
}

.meta span{
    padding:7px 10px;

    border-radius:6px;

    border:1px solid #292929;

    background:#1a1a1a;

    color:#777;

    font-size:9px;
}

.description{
    margin-top:24px;

    padding-top:20px;

    border-top:1px solid #272727;

    color:#8b8b8b;

    font-size:11px;

    line-height:1.75;

    max-width:1000px;
}

.game-url{
    margin-top:12px;

    color:#555;

    font-size:9px;

    word-break:break-all;
}

.game-url a{
    color:#999;
    text-decoration:none;
}

.game-url a:hover{
    color:white;
}

.actions{
    display:flex;
    align-items:center;
    gap:9px;

    margin-top:22px;
    padding-top:19px;

    border-top:1px solid #272727;
}

.action{
    min-width:105px;

    padding:11px 15px;

    border-radius:7px;

    border:1px solid #343434;

    background:#191919;

    color:#c4c4c4;

    font-size:9px;
    font-weight:800;

    cursor:pointer;
}

.action:hover{
    background:#222;
    color:white;
}

.action.approve{
    background:#e7ffd9;
    color:#101610;
    border-color:#e7ffd9;
}

.action.approve:hover{
    background:#d0f7bd;
}

.action.reject{
    color:#ff9d9d;
    border-color:#462525;
}

.action.reject:hover{
    background:#251414;
}

.action.delete{
    color:#ff9b9b;
    border-color:#542727;
}

.action.delete:hover{
    background:#2a1313;
    color:#fff;
}

.review-info{
    margin-left:auto;
    color:#4f4f4f;
    font-size:9px;
}

.reason{
    display:none;

    margin-top:14px;

    padding:15px;

    border-radius:9px;

    background:#0a0a0a;

    border:1px solid #292929;
}

.reason textarea{
    width:100%;

    min-height:90px;

    padding:12px;

    resize:vertical;

    border-radius:7px;

    background:#070707;

    border:1px solid #292929;

    outline:none;

    color:white;

    font-size:10px;
}

.reason-actions{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.reason-actions button{
    padding:9px 13px;

    border-radius:6px;

    background:#181818;

    border:1px solid #333;

    color:#bbb;

    font-size:9px;

    cursor:pointer;
}

.reason-actions .confirm{
    color:#ff9b9b;
    border-color:#472424;
}

.loading,
.empty{
    padding:90px 20px;
    text-align:center;
    color:#555;
    font-size:11px;
}

.error{
    margin:20px;

    padding:15px;

    border-radius:8px;

    background:#1c0e0e;

    border:1px solid #442121;

    color:#ff9d9d;

    font-size:10px;
    line-height:1.6;
}

@media(max-width:1000px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .header{
        align-items:flex-start;
        flex-direction:column;
    }

}

@media(max-width:700px){

    .topbar{
        padding:0 18px;
    }

    .container{
        width:94%;
        margin-top:35px;
    }

    h1{
        font-size:37px;
    }

    .stats{
        gap:10px;
    }

    .stat{
        padding:18px;
        min-height:115px;
    }

    .stat-number{
        font-size:30px;
    }

    .toolbar{
        flex-wrap:wrap;
        padding:13px;
    }

    .tab{
        padding:9px 11px;
    }

    .search{
        width:100%;
        margin-left:0;
        margin-top:4px;
    }

    .content{
        padding:12px;
    }

    .submission{
        padding:17px;
    }

    .card-top{
        flex-direction:column;
    }

    .thumbnail{
        width:100%;
        height:190px;
    }

    .game-name{
        font-size:22px;
    }

    .actions{
        flex-wrap:wrap;
    }

    .review-info{
        width:100%;
        margin-left:0;
        margin-top:5px;
    }

}

</style>
</head>

<body>

<header class="topbar">

    <div class="logo">
        <span class="logo-mark"></span>
        PLAYR
    </div>

    <div class="admin-pill">
        <span class="admin-dot"></span>
        PRIVATE ADMIN
    </div>

</header>

<main class="container">

<section class="header">

    <div>

        <div class="eyebrow">
            Developer Portal
        </div>

        <h1>
            Game submissions
        </h1>

        <p>
            Review and manage every game submitted to PLAYR.
        </p>

    </div>

    <button
        class="refresh"
        id="refreshButton"
    >
        ↻ &nbsp; Refresh
    </button>

</section>

<section class="stats">

    <div class="stat">

        <div class="stat-label">
            Total submissions
        </div>

        <div
            class="stat-number"
            id="totalCount"
        >
            0
        </div>

        <div class="stat-sub">
            All submissions
        </div>

    </div>

    <div class="stat">

        <div class="stat-label">
            Pending review
        </div>

        <div
            class="stat-number"
            id="pendingCount"
        >
            0
        </div>

        <div class="stat-sub">
            Waiting for decision
        </div>

    </div>

    <div class="stat">

        <div class="stat-label">
            Approved
        </div>

        <div
            class="stat-number"
            id="approvedCount"
        >
            0
        </div>

        <div class="stat-sub">
            Currently approved
        </div>

    </div>

    <div class="stat">

        <div class="stat-label">
            Rejected
        </div>

        <div
            class="stat-number"
            id="rejectedCount"
        >
            0
        </div>

        <div class="stat-sub">
            Declined submissions
        </div>

    </div>

</section>

<section class="panel">

<div class="toolbar">

    <button
        class="tab active"
        data-tab="all"
    >
        ALL
    </button>

    <button
        class="tab"
        data-tab="pending"
    >
        PENDING
    </button>

    <button
        class="tab"
        data-tab="approved"
    >
        APPROVED
    </button>

    <button
        class="tab"
        data-tab="rejected"
    >
        REJECTED
    </button>

    <input
        class="search"
        id="search"
        type="search"
        placeholder="Search games, developers or categories..."
    >

</div>

<div id="errorBox"></div>

<div class="content">

    <div
        class="submissions"
        id="submissions"
    >

        <div class="loading">
            Loading submissions...
        </div>

    </div>

</div>

</section>

</main>

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDo-HuNAg5riiSDm-vqbtlrq1E2qY6fhz8",

    authDomain:
        "playr-bebbf.firebaseapp.com",

    databaseURL:
        "https://playr-bebbf-default-rtdb.firebaseio.com",

    projectId:
        "playr-bebbf",

    storageBucket:
        "playr-bebbf.firebasestorage.app",

    messagingSenderId:
        "35506561862",

    appId:
        "1:35506561862:web:f7b27c1191637cf36abb47",

    measurementId:
        "G-C9RGJYKTP9"

};

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


let submissions = [];
let currentTab = "all";


const list =
    document.getElementById("submissions");

const search =
    document.getElementById("search");

const errorBox =
    document.getElementById("errorBox");


async function loadSubmissions(){

    list.innerHTML = `
        <div class="loading">
            Loading submissions...
        </div>
    `;

    errorBox.innerHTML = "";

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "game_submissions"
                )
            );

        submissions =
            snapshot.docs.map(
                item => ({
                    id:item.id,
                    ...item.data()
                })
            );

        submissions.sort(
            (a,b) => {

                const A =
                    a.createdAt?.seconds || 0;

                const B =
                    b.createdAt?.seconds || 0;

                return B - A;

            }
        );

        updateStats();

        render();

    }

    catch(error){

        console.error(error);

        errorBox.innerHTML = `
            <div class="error">
                Could not load submissions:
                ${escapeHTML(error.message)}
            </div>
        `;

        list.innerHTML = `
            <div class="empty">
                Unable to load submissions.
            </div>
        `;

    }

}


function updateStats(){

    document.getElementById("totalCount").textContent =
        submissions.length;

    document.getElementById("pendingCount").textContent =
        submissions.filter(
            x => x.status === "pending"
        ).length;

    document.getElementById("approvedCount").textContent =
        submissions.filter(
            x => x.status === "approved"
        ).length;

    document.getElementById("rejectedCount").textContent =
        submissions.filter(
            x => x.status === "rejected"
        ).length;

}


function render(){

    const term =
        search.value
        .trim()
        .toLowerCase();

    const filtered =
        submissions.filter(
            item => {

                const statusOK =
                    currentTab === "all" ||
                    item.status === currentTab;

                const text =
                    (
                        item.gameName || ""
                    ).toLowerCase()
                    + " " +
                    (
                        item.developer ||
                        item.developerName ||
                        ""
                    ).toLowerCase()
                    + " " +
                    (
                        item.email || ""
                    ).toLowerCase()
                    + " " +
                    (
                        item.country || ""
                    ).toLowerCase()
                    + " " +
                    (
                        item.category || ""
                    ).toLowerCase()
                    + " " +
                    (
                        item.developerType || ""
                    ).toLowerCase()
                    + " " +
                    (
                        item.language || ""
                    ).toLowerCase();

                return (
                    statusOK &&
                    (!term || text.includes(term))
                );

            }
        );

    if(!filtered.length){

        list.innerHTML = `
            <div class="empty">
                No submissions found.
            </div>
        `;

        return;

    }

    list.innerHTML =
        filtered
        .map(renderCard)
        .join("");

}


function renderCard(item){

    let date = "Unknown";

    if(item.createdAt?.toDate){

        date =
            item.createdAt
            .toDate()
            .toLocaleString();

    }


    let reviewed = "";

    if(item.reviewedAt?.toDate){

        reviewed =
            "Reviewed " +
            item.reviewedAt
            .toDate()
            .toLocaleString();

    }


    const developer =
        item.developer ||
        item.developerName ||
        "Unknown developer";

    const githubUrl =
        item.githubUrl ||
        item.gameUrl ||
        "";

    const thumbnail =
        item.thumbnailData ||
        item.thumbnailUrl ||
        "";


    const image =
        thumbnail
        ? `
            <img
                src="${safe(thumbnail)}"
                alt="${escapeHTML(item.gameName || "Game thumbnail")}"
                onerror="this.style.display='none'"
            >
        `
        : `
            <div class="thumbnail-placeholder">
                PLAYR
            </div>
        `;


    const controls =
        item.controls ||
        "Not provided";

    const supportedDevices =
        item.supportedDevices ||
        "Not provided";

    const orientation =
        item.orientation ||
        "Not provided";

    const language =
        item.language ||
        "Not provided";

    const country =
        item.country ||
        "Not provided";

    const developerType =
        item.developerType ||
        "Not provided";


    return `

    <article
        class="submission"
        data-id="${safe(item.id)}"
    >

        <div class="card-top">

            <div class="thumbnail">
                ${image}
            </div>

            <div class="info">

                <div class="title-line">

                    <div class="game-name">
                        ${escapeHTML(
                            item.gameName ||
                            "Untitled Game"
                        )}
                    </div>

                    <span
                        class="status ${safe(
                            item.status || "pending"
                        )}"
                    >
                        ${escapeHTML(
                            item.status || "pending"
                        )}
                    </span>

                </div>

                <div class="developer">
                    ${escapeHTML(developer)}
                    &nbsp; · &nbsp;
                    ${escapeHTML(item.email || "No email")}
                </div>

                <div class="meta">

                    <span>
                        Category:
                        ${escapeHTML(
                            item.category ||
                            "Not provided"
                        )}
                    </span>

                    <span>
                        Country:
                        ${escapeHTML(country)}
                    </span>

                    <span>
                        Type:
                        ${escapeHTML(developerType)}
                    </span>

                    <span>
                        Devices:
                        ${escapeHTML(supportedDevices)}
                    </span>

                    <span>
                        Orientation:
                        ${escapeHTML(orientation)}
                    </span>

                    <span>
                        Language:
                        ${escapeHTML(language)}
                    </span>

                    <span>
                        Submitted ${escapeHTML(date)}
                    </span>

                </div>

            </div>

        </div>

        <div class="description">

            <strong style="color:#cfcfcf;">
                Description
            </strong>

            <br><br>

            ${escapeHTML(
                item.description ||
                "No description provided."
            )}

        </div>

        <div class="description">

            <strong style="color:#cfcfcf;">
                Controls / Instructions
            </strong>

            <br><br>

            ${escapeHTML(controls)}

        </div>

        <div class="game-url">

            <strong style="color:#cfcfcf;">
                GitHub Repository
            </strong>

            <br>

            ${
                githubUrl
                ? `
                    <a
                        href="${safe(githubUrl)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${escapeHTML(githubUrl)}
                    </a>
                `
                : `
                    <span style="color:#555;">
                        Not provided
                    </span>
                `
            }

        </div>

        <div class="actions">

            ${
                githubUrl
                ? `
                    <button
                        class="action"
                        data-action="open"
                        data-id="${safe(item.id)}"
                    >
                        OPEN GITHUB
                    </button>
                `
                : ""
            }

            ${
                item.status !== "approved"
                ? `
                    <button
                        class="action approve"
                        data-action="approve"
                        data-id="${safe(item.id)}"
                    >
                        ✓ APPROVE
                    </button>
                `
                : ""
            }

            ${
                item.status !== "rejected"
                ? `
                    <button
                        class="action reject"
                        data-action="reject"
                        data-id="${safe(item.id)}"
                    >
                        ✕ REJECT
                    </button>
                `
                : ""
            }

            <button
                type="button"
                class="action delete"
                data-action="delete"
                data-id="${safe(item.id)}"
            >
                🗑 DELETE
            </button>

            <div class="review-info">
                ${escapeHTML(reviewed)}
            </div>

        </div>

        <div
            class="reason"
            id="reason-${safe(item.id)}"
        >

            <textarea
                id="reasonText-${safe(item.id)}"
                placeholder="Optional rejection reason..."
            >${escapeHTML(
                item.rejectionReason || ""
            )}</textarea>

            <div class="reason-actions">

                <button
                    class="confirm"
                    data-action="confirmReject"
                    data-id="${safe(item.id)}"
                >
                    Confirm rejection
                </button>

                <button
                    data-action="cancelReject"
                    data-id="${safe(item.id)}"
                >
                    Cancel
                </button>

            </div>

        </div>

    </article>

    `;
}


list.addEventListener(
    "click",
    async event => {

        const button =
            event.target.closest("button");

        if(!button){
            return;
        }

        const action =
            button.dataset.action;

        const id =
            button.dataset.id;


        if(action === "open"){

            const item =
                submissions.find(
                    x => x.id === id
                );

            const openUrl =
                item?.githubUrl ||
                item?.gameUrl ||
                "";

            if(openUrl){

                window.open(
                    openUrl,
                    "_blank"
                );

            }

            return;
        }


        if(action === "approve"){

            await approve(id);

            return;
        }


        if(action === "reject"){

            const box =
                document.getElementById(
                    "reason-" + id
                );

            if(box){
                box.style.display = "block";
            }

            return;
        }


        if(action === "cancelReject"){

            const box =
                document.getElementById(
                    "reason-" + id
                );

            if(box){
                box.style.display = "none";
            }

            return;
        }


        if(action === "confirmReject"){

            await reject(id);

            return;
        }


        if(action === "delete"){

            await deleteSubmission(id);

            return;
        }

    }
);


async function approve(id){

    const item =
        submissions.find(
            x => x.id === id
        );

    if(!item){
        return;
    }


    if(
        !confirm(
            `Approve "${item.gameName}"?`
        )
    ){
        return;
    }


    try{

        /*
         * APPROVAL:
         * status becomes "approved".
         *
         * index.html can now automatically
         * show this game by reading only
         * approved submissions.
         */

        await updateDoc(
            doc(
                db,
                "game_submissions",
                id
            ),
            {
                status:"approved",

                reviewedAt:
                    serverTimestamp(),

                approvedAt:
                    serverTimestamp(),

                rejectionReason:null
            }
        );


        item.status =
            "approved";

        item.rejectionReason =
            null;

        item.reviewedAt = {
            toDate:() => new Date()
        };

        item.approvedAt = {
            toDate:() => new Date()
        };


        updateStats();

        render();

    }

    catch(error){

        console.error(error);

        showError(
            "Approve failed: " +
            error.message
        );

    }

}


async function reject(id){

    const item =
        submissions.find(
            x => x.id === id
        );

    if(!item){
        return;
    }


    const textarea =
        document.getElementById(
            "reasonText-" + id
        );


    const reason =
        textarea
        ? textarea.value.trim()
        : "";


    if(
        !confirm(
            `Reject "${item.gameName}"?`
        )
    ){
        return;
    }


    try{

        await updateDoc(
            doc(
                db,
                "game_submissions",
                id
            ),
            {
                status:"rejected",

                reviewedAt:
                    serverTimestamp(),

                approvedAt:null,

                rejectionReason:
                    reason || null
            }
        );


        item.status =
            "rejected";

        item.reviewedAt = {
            toDate:() => new Date()
        };

        item.approvedAt = null;

        item.rejectionReason =
            reason || null;


        updateStats();

        render();

    }

    catch(error){

        showError(
            "Reject failed: " +
            error.message
        );

    }

}


async function deleteSubmission(id){

    const item =
        submissions.find(
            x => x.id === id
        );

    if(!item){

        showError(
            "Submission not found."
        );

        return;
    }


    const title =
        item.gameName ||
        "this submission";


    const confirmed =
        window.confirm(
            `PERMANENTLY DELETE "${title}"?\n\n` +
            `This will completely remove the submission ` +
            `from Firestore. This cannot be undone.`
        );


    if(!confirmed){
        return;
    }


    try{

        await deleteDoc(
            doc(
                db,
                "game_submissions",
                id
            )
        );


        submissions =
            submissions.filter(
                x => x.id !== id
            );


        updateStats();

        render();

    }

    catch(error){

        console.error(
            "Delete error:",
            error
        );


        if(
            error.code ===
            "permission-denied"
        ){

            showError(
                "Delete blocked by Firestore Rules. " +
                "Your rules must allow delete for game_submissions."
            );

        }
        else{

            showError(
                "Delete failed: " +
                error.message
            );

        }

    }

}

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function safe(value){

    return escapeHTML(value);

}


function showError(message){

    errorBox.innerHTML = `
        <div class="error">
            ${escapeHTML(message)}
        </div>
    `;

}
